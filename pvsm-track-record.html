<style>
:root{--bg:#f7f7f5;--card:#fff;--s1:#f1f0ec;--tx:#1f1f1d;--tx2:#5f5e5a;--mu:#8a8984;--bd:rgba(0,0,0,.12);--bd2:rgba(0,0,0,.28);--ac:#185FA5;--acbg:#E6F1FB;--ok:#3B6D11;--okbg:#EAF3DE;--wa:#854F0B;--wabg:#FAEEDA;--da:#A32D2D;--dabg:#FCEBEB;--r:8px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1a;--card:#262624;--s1:#30302d;--tx:#eceae4;--tx2:#b4b2a9;--mu:#888780;--bd:rgba(255,255,255,.12);--bd2:rgba(255,255,255,.28);--ac:#85B7EB;--acbg:#0C447C;--ok:#C0DD97;--okbg:#27500A;--wa:#FAC775;--wabg:#633806;--da:#F7C1C1;--dabg:#791F1F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:18px;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd2);border-radius:var(--r);padding:6px 10px}
input,select{height:34px}
button{cursor:pointer}button:hover{background:var(--s1)}
.pri{background:#185FA5;color:#fff;border-color:#185FA5}.pri:hover{background:#0C447C}
.on{background:var(--acbg);color:var(--ac);border-color:var(--ac)}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.t th,.t td{border-bottom:1px solid var(--bd);padding:7px 6px;text-align:left;vertical-align:top;overflow:hidden;text-overflow:ellipsis}
.t th{color:var(--tx2);font-weight:500}
.chip{font-size:12px;padding:2px 8px;border-radius:var(--r);white-space:nowrap;display:inline-block}
.ok{background:var(--okbg);color:var(--ok)}.soon{background:var(--wabg);color:var(--wa)}.over{background:var(--dabg);color:var(--da)}.paid,.none{background:var(--s1);color:var(--tx2)}.run{background:var(--acbg);color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
label.f{display:block;font-size:12px;color:var(--tx2)}label.f input,label.f select,label.f textarea{width:100%;margin-top:3px}
.bad{border-color:var(--da)!important;box-shadow:0 0 0 1px var(--da)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.m{background:var(--s1);border-radius:var(--r);padding:10px 12px}.m p{margin:0;font-size:12px;color:var(--tx2)}.m b{font-size:22px;font-weight:600}
.drop{border:1.5px dashed var(--bd2);border-radius:var(--r);padding:14px;text-align:center;color:var(--tx2);font-size:13px}
.sec{font-size:14px;font-weight:600;margin:0 0 10px}.lnk{cursor:pointer;color:var(--ac)}.mu{color:var(--mu);font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{display:block;white-space:normal;margin-bottom:10px;padding:8px 10px}
fieldset{border:0;padding:0;margin:0;min-width:0}
</style>
</head>

const ov=live().filter(x=>x!==p&&x.vkey===p.vkey&&x.start&&p.start&&x.start<=(p.endAct||p.endEst||p.start)&&p.start<=(x.endAct||x.endEst||x.start));
S.toast=t('saved',p.code+' · '+p.name)+(ov.length?t('overlap',ov.map(x=>x.code).join(', ')):'');S.edit=null;render()}
function dl(name,data,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function xls(){const rows=flt(),cs=COLS.filter(c=>c.fx||csel[c.k]),N=cs.length;
const B='<Borders>'+['Left','Right','Top','Bottom'].map(p=>`<Border ss:Position="${p}" ss:LineStyle="Continuous" ss:Weight="1"/>`).join('')+'</Borders>',FN='<Font ss:FontName="Times New Roman" ss:Bold="1"/>';
const st=`<Styles><Style ss:ID="Default"><Font ss:FontName="Times New Roman" ss:Size="11"/></Style><Style ss:ID="ti"><Font ss:FontName="Times New Roman" ss:Bold="1" ss:Size="14"/></Style><Style ss:ID="sub"><Font ss:FontName="Times New Roman" ss:Italic="1"/></Style><Style ss:ID="h">${B}${FN}<Interior ss:Color="#D9E1F2" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/></Style><Style ss:ID="sec">${B}${FN}<Interior ss:Color="#F2F2F2" ss:Pattern="Solid"/></Style><Style ss:ID="s">${B}<Alignment ss:Vertical="Center" ss:WrapText="1"/></Style><Style ss:ID="c">${B}<Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style><Style ss:ID="n0">${B}<NumberFormat ss:Format="#,##0"/><Alignment ss:Vertical="Center"/></Style><Style ss:ID="n2">${B}<NumberFormat ss:Format="#,##0.00"/><Alignment ss:Vertical="Center"/></Style><Style ss:ID="t">${B}${FN}</Style><Style ss:ID="t0">${B}${FN}<NumberFormat ss:Format="#,##0"/></Style><Style ss:ID="t2">${B}${FN}<NumberFormat ss:Format="#,##0.00"/></Style></Styles>`;
let r=3,sec=0,subs=[],body=`<Row><Cell ss:StyleID="ti" ss:MergeAcross="${N-1}"><Data ss:Type="String">TRACK RECORD</Data></Cell></Row><Row><Cell ss:StyleID="sub" ss:MergeAcross="${N-1}"><Data ss:Type="String">Updated ${vn(TD)} · ${rows.length} projects</Data></Cell></Row><Row ss:Height="32">${cs.map(c=>`<Cell ss:StyleID="h"><Data ss:Type="String">${h(c.t)}</Data></Cell>`).join('')}</Row>`;
const tot=(lab,f)=>'<Row>'+cs.map((c,j)=>j===1?`<Cell ss:StyleID="t"><Data ss:Type="String">${lab}</Data></Cell>`:c.sum?`<Cell ss:StyleID="t${c.n?2:0}" ss:Formula="${f}"/>`:'<Cell ss:StyleID="t"/>').join('')+'</Row>';
CATS.forEach((ct,ci)=>{const rs=rows.filter(p=>p.cat===ct).sort((a,b)=>(a.start||'9').localeCompare(b.start||'9'));if(!rs.length)return;sec++;r++;
body+=`<Row><Cell ss:StyleID="sec"><Data ss:Type="String">${ROM[sec-1]}</Data></Cell><Cell ss:StyleID="sec" ss:MergeAcross="${N-2}"><Data ss:Type="String">${CUP[ci]}</Data></Cell></Row>`;
rs.forEach((p,i)=>{r++;body+='<Row>'+cs.map(c=>{if(c.k==='sn')return`<Cell ss:StyleID="c"><Data ss:Type="Number">${i+1}</Data></Cell>`;const v=cell(p,c.k);return c.n!==undefined&&typeof v==='number'?`<Cell ss:StyleID="n${c.n?2:0}"><Data ss:Type="Number">${v}</Data></Cell>`:`<Cell ss:StyleID="s"><Data ss:Type="String">${h(v??'')}</Data></Cell>`}).join('')+'</Row>'});
if(S.sub){r++;subs.push(r);body+=tot('Sub-total',`=SUM(R[-${rs.length}]C:R[-1]C)`)}});
if(rows.length)body+=tot('TOTAL',S.sub?'='+subs.map(x=>'R'+x+'C').join('+'):`=SUM(R4C:R${r}C)`);
const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${st}<Worksheet ss:Name="Track Record"><Table>${cs.map(c=>`<Column ss:Width="${c.w}"/>`).join('')}${body}</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><FrozenNoSplit/><SplitHorizontal>3</SplitHorizontal><TopRowBottomPane>3</TopRowBottomPane></WorksheetOptions></Worksheet></Workbook>`;
dl(`Track_Record_${TD}.xls`,xml,'application/vnd.ms-excel');S.toast=t('xls_done',rows.length,sec);render()}
R.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.closest('fieldset[disabled]'))return;const a=b.dataset.a,v=b.dataset.v;if(a==='tab')S.toast='';
if(a==='tab'){S.tab=v;S.edit=null}
else if(a==='lang'){lang=v;localStorage.setItem('pvsm_lang',lang)}
else if(a==='new'){S.edit=blank();S.errs={};S.msg=[];S.info='';S.view=null}
else if(a==='edit'){S.tab='proj';S.edit=draft(PR.find(p=>p.id===+v));S.errs={};S.msg=[];S.info='';S.view=S.edit.files.length?0:null}
else if(a==='cancel')S.edit=null;
else if(a==='save')return save();
else if(a==='delp'){const p=PR.find(x=>x.id===S.edit.id);p.del=true;log('lg_del',p.code+' '+p.name);S.toast=t('deleted',p.name);S.edit=null}
else if(a==='split'){S.split=!S.split;if(S.view===null&&S.edit.files.length)S.view=0}
else if(a==='view')S.view=+v;
else if(a==='rmf'){S.edit.files.splice(+v,1);S.view=null}
else if(a==='xls')return xls();
else if(a==='pg'){const n=+v;if(n>=0)S.page=n;$('tbl').innerHTML=tbl();return}
else if(a==='showbad'){S.tab='proj';S.edit=null;S.f.iss='1';S.page=0}
else if(a==='imp')S.imp={text:'',rows:null};
else if(a==='impclose')S.imp=null;
else if(a==='impparse'){const rows=pImport(S.imp.text||'');if(!rows.length){$('imperr').textContent=t('imp_err');return}S.imp.rows=rows}
else if(a==='impgo'){const[ad,up]=impGo(S.imp.rows);log('lg_imp',ad,up);S.imp=null;S.f={q:'',cat:'',year:'',type:'',country:'',st:'',iss:''};S.page=0;S.toast=t('imp_done',ad,up)}
else if(a==='godebt'){S.tab='debt';S.pid=+v;S.edit=null}
else if(a==='rc'||a==='plan'){const i=IN.find(x=>x.id===+v),p=PR.find(x=>x.id===i.pid);if(a==='rc'){const amt=+$('ra'+v).value,dt=$('rd'+v).value;if(!(amt>0)||!dt){S.toast=t('d_rerr');return render()}i.rc.push({date:dt,amt});log('lg_rc',p.code+' / '+i.name,fc(p,amt)+' '+vn(dt));S.toast=t('d_recd',fc(p,amt))}else{const amt=+$('pa'+v).value,dt=$('pd'+v).value;if(!(amt>0)||!dt){S.toast=t('d_rerr');return render()}i.plan=amt;i.planDate=dt;log('lg_plan',p.code+' / '+i.name,fc(p,amt)+' '+vn(dt));S.toast=t('d_pland')}}
else if(a==='tpl'){const p=PR.find(x=>x.id===S.pid);[[t('tp_adv'),30,p.start],[t('tp_acc'),60,p.endAct||p.endEst],[t('tp_war'),10,'']].forEach(([n,q,du])=>{IN.push({id:nid(),pid:p.id,name:n,pct:q,amount:Math.round(base(p)*q)/100,due:du||'',plan:'',planDate:'',rc:[]});log('lg_inst',p.code,n+' '+q+'%')})}
else if(a==='addi'){const p=PR.find(x=>x.id===S.pid),n=$('nn').value.trim(),q=+$('np').value,du=$('nd').value;if(!n||!(q>0)){$('nerr').textContent=t('d_ierr');return}IN.push({id:nid(),pid:p.id,name:n,pct:q,amount:Math.round(base(p)*q)/100,due:du,plan:'',planDate:'',rc:[]});log('lg_inst',p.code,n+' '+q+'%')}
else if(a==='bkexp'){dl(`PVSM_TrackRecord_backup_${TD}.json`,JSON.stringify({PR,IN,LOG,rate:S.rate,uid}),'application/json');return}
else if(a==='reset'){if(!confirm(t('a_reset_q')))return;seed();log('lg_reset')}
else if(a==='merge'){const k=S.mk[+v],sel=document.querySelector(`input[name="m${v}"]:checked`);if(!sel)return;let n=0;live().forEach(p=>{if(ckey(p.client)===k&&p.client!==sel.value){p.client=sel.value;n++}});log('lg_merge',sel.value,n);S.toast=t('a_merged',n,sel.value)}
else if(a==='restore'){const p=PR.find(x=>x.id===+v);p.del=false;log('lg_restore',p.code+' '+p.name)}
else if(a==='purge'){if(!confirm(t('a_purge_q')))return;const p=PR.find(x=>x.id===+v);log('lg_purge',p.code+' '+p.name);PR=PR.filter(x=>x.id!==+v);IN=IN.filter(i=>i.pid!==+v)}
render()});
R.addEventListener('input',ev=>{const x=ev.target;
if(x.dataset.imp){S.imp.text=x.value;return}
if(x.dataset.f!==undefined){S.f[x.dataset.f]=x.type==='checkbox'?(x.checked?'1':''):x.value;S.page=0;$('tbl').innerHTML=tbl();return}
if(x.dataset.k&&S.edit){const k=x.dataset.k;S.edit[k]=x.type==='checkbox'?x.checked:x.value;if(S.errs[k]){delete S.errs[k];x.classList.remove('bad')}const c=$('calc');if(c)c.innerHTML=calc()}});
R.addEventListener('change',ev=>{const x=ev.target;
if(x.dataset.g==='role'){role=x.value;localStorage.setItem('pvsm_role',role);render();return}
if(x.dataset.c){if(x.dataset.c==='_sub')S.sub=x.checked;else csel[x.dataset.c]=x.checked;return}
if(x.dataset.fc!==undefined){S.edit.files[+x.dataset.fc].cat=x.value;return}
if(x.dataset.a2==='file'){[...x.files].forEach(addFile);return}
if(x.dataset.a2==='bk'){const f=x.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.PR))throw 0;PR=o.PR;IN=o.IN||[];LOG=o.LOG||[];S.rate=o.rate||26000;uid=o.uid||1000;log('lg_bk');S.toast=t('a_restored')}catch(e){S.toast=t('a_bad')}render()};r.readAsText(f);return}
if(x.dataset.d==='pid'){S.pid=x.value?+x.value:'';render();return}
if(x.dataset.s==='rate'){const r=+x.value;if(r>0&&r!==S.rate){log('lg_rate',S.rate,r);S.rate=r;S.toast=t('a_rated')}render();return}
if(x.dataset.f!==undefined||!S.edit)return;const k=x.dataset.k,e=S.edit;
if(k==='name'){const key=vkey(x.value),prev=live().filter(p=>p.vkey===key&&p.id!==e.id).sort((a,b)=>(b.start||'').localeCompare(a.start||''));const last=prev[0];if(last){['imo','vtype','detail','loa','beam','depth'].forEach(y=>{if(!e[y])e[y]=last[y]});if(!e.client)['client','country','region','contact','email','phone','rep'].forEach(y=>e[y]=last[y]);S.info=t('autofill',prev.length,yr(last));render()}}
if(k==='country'&&!e.region){e.region=regionOf(x.value);render()}
if(k==='cur'||k==='cat')render()});
R.addEventListener('dragover',ev=>{if(ev.target.closest('#drop'))ev.preventDefault()});
R.addEventListener('drop',ev=>{if(!ev.target.closest('#drop')||!canP())return;ev.preventDefault();[...ev.dataTransfer.files].forEach(addFile)});
document.addEventListener('paste',ev=>{if(S.tab!=='proj'||!S.edit||!canP())return;const it=[...(ev.clipboardData?.items||[])].filter(x=>x.kind==='file');if(!it.length)return;ev.preventDefault();it.forEach(x=>addFile(x.getAsFile()))});
if(!loadDB())seed();
render();
